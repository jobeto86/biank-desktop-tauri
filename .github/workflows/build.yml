name: Build Biank Desktop (Tauri)
on:
  workflow_dispatch:
    inputs:
      core_sha:
        description: SHA aprobado e inmutable del core privado
        required: true
        type: string
      windows_only:
        description: Repetir únicamente Windows después de validar macOS
        type: boolean
        default: false
      macos_only:
        description: Repetir únicamente macOS
        type: boolean
        default: false
      signed:
        description: Firmar para updater (no certificado Windows/Apple); no publica latest
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tauri-candidate-${{ github.ref }}-${{ inputs.core_sha }}-${{ inputs.windows_only }}-${{ inputs.macos_only }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","cloud_platform":"win","arch":"x64","bundles":"nsis"}]' || inputs.macos_only && '[{"platform":"macos-15","target":"aarch64-apple-darwin","cloud_platform":"mac","arch":"arm64","bundles":"app,dmg"}]' || '[{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","cloud_platform":"win","arch":"x64","bundles":"nsis"},{"platform":"macos-15","target":"aarch64-apple-darwin","cloud_platform":"mac","arch":"arm64","bundles":"app,dmg"}]') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require immutable core and scoped read grant
        shell: bash
        env:
          CORE_SHA: ${{ inputs.core_sha }}
          CORE_GRANT: ${{ secrets.BIANK_CORE_READ_SSH_KEY }}
        run: |
          [[ "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Se requiere el SHA completo del core aprobado'; exit 1; }
          test -n "$CORE_GRANT" || { echo 'Falta el grant read-only del core'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: jobeto86/biank
          ref: ${{ inputs.core_sha }}
          ssh-key: ${{ secrets.BIANK_CORE_READ_SSH_KEY }}
          persist-credentials: false
          path: .core
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a native platform payload
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if(process.arch !== process.env.EXPECTED_ARCH)throw Error("Runner architecture does not match the bundled runtime")'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Validate native account browser regression
        run: |
          node --test tools/auth-bridge.test.mjs tools/startup.test.mjs
          node --experimental-strip-types --test .core/apps/desktop/coordinator/test/account-native-browser.test.ts
      - name: Check macOS resource normalization
        if: runner.os == 'macOS'
        run: node --test tools/runtime-links.test.mjs
      - name: Build exact coordinator and platform runtime
        working-directory: .core/apps/desktop/coordinator
        run: |
          npm ci
          npm run build
          npm run bundle
          npm run stage:runtime
          node tools/stage-candidate-browser.mjs
      - name: Build web interface
        working-directory: .core/apps/desktop/web
        run: npm ci && npm run build
      - name: Validate real shared Chromium on the target OS
        working-directory: .core/apps/desktop/coordinator
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.core/apps/desktop/dist/coordinator-runtime/browsers
        run: node --experimental-sqlite --import tsx --test test/tauri-browser.integration.ts
      - name: Install pinned official Codex distribution
        working-directory: .core/apps/desktop/desktop/vendor
        run: npm ci --ignore-scripts
      - name: Stage bundled runtimes
        env:
          BIANK_CORE_DESKTOP: ${{ github.workspace }}/.core/apps/desktop
          BIANK_GOOGLE_CLIENT_ID: ${{ vars.BIANK_GOOGLE_CLIENT_ID }}
        run: |
          node tools/stage-codex.mjs
          node .core/apps/desktop/desktop/build/stage-cloudflared.mjs ${{ matrix.cloud_platform }} ${{ matrix.arch }}
          npm run stage:runtime
      - name: Validate first ChatGPT authorization with bundled Codex
        working-directory: .core/apps/desktop/coordinator
        env:
          BIANK_CODEX_EXECUTABLE: ${{ github.workspace }}/.core/apps/desktop/dist/codex/${{ runner.os == 'Windows' && 'codex.exe' || 'codex' }}
        run: node --experimental-sqlite --import tsx --test test/codex-account-native.integration.ts
      - name: Configure signed updater
        if: inputs.signed
        env:
          BIANK_TAURI_PUBLIC_KEY: ${{ vars.BIANK_TAURI_PUBLIC_KEY }}
        run: npm run configure:updater
      - name: Check native contracts
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build unsigned QA installer
        if: ${{ !inputs.signed }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Validate native startup before packaging
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked
          node -e 'require("node:fs").cpSync("src-tauri/runtime",process.env.RUNNER_TEMP+"/Biank-Isolated-Resources/runtime",{recursive:true,verbatimSymlinks:true})'
          export BIANK_TAURI_TEST_RESOURCE_ROOT="$RUNNER_TEMP/Biank-Isolated-Resources"
          if [[ "$RUNNER_OS" == Windows ]]; then executable=src-tauri/target/debug/biank-desktop.exe; else executable=src-tauri/target/debug/biank-desktop; fi
          node tools/validate-installed.mjs "$executable" "$BIANK_TAURI_TEST_RESOURCE_ROOT/runtime"
      - name: Build updater-signed artifacts
        if: inputs.signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/updater.conf.json
      - name: Verify macOS ad hoc signature before installation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Biank.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -Fx 'Signature=adhoc'
      - name: Install and run actual Windows NSIS candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe').FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Biank-Installed-QA'
          $installed = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$destination" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "NSIS installation failed: $($installed.ExitCode)" }
          node tools/validate-installed.mjs "$destination/biank-desktop.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows validation failed' }
      - name: Mount and run actual macOS DMG candidate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/Biank-DMG-QA"
          hdiutil attach src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Biank.app" "$RUNNER_TEMP/Biank-Installed-QA.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Biank-Installed-QA.app"
          codesign --display --verbose=4 "$RUNNER_TEMP/Biank-Installed-QA.app" 2>&1 | grep -Fx 'Signature=adhoc'
          node tools/validate-installed.mjs "$RUNNER_TEMP/Biank-Installed-QA.app/Contents/MacOS/biank-desktop"
          node tools/assess-macos.mjs "$RUNNER_TEMP/Biank-Installed-QA.app" "$RUNNER_TEMP/macos-trust.json"
      - name: Retain macOS trust assessment
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Biank-macOS-trust
          path: ${{ runner.temp }}/macos-trust.json
          if-no-files-found: error
          retention-days: 3
      - name: Retain candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: Biank-Tauri-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
