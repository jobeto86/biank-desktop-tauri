name: Windows installer guards
on:
  push:
    paths:
      - src-tauri/windows/**
      - tools/windows-installer-*.test.ps1
      - .github/workflows/installer-guards.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guards:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Process, file and legacy guards
        shell: pwsh
        run: ./tools/windows-installer-guard.test.ps1
      - name: NSIS hook under Windows PowerShell
        shell: pwsh
        run: ./tools/windows-installer-hook.test.ps1
