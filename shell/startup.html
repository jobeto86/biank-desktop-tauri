<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light"><title>Biank</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eeeaf7;background:#100e17;color-scheme:dark;--muted:#b5aec8;--accent:#b698ed;--edge:#30283e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(ellipse at 50% 36%,#251b37 0,transparent 60%)}
main{text-align:center;width:min(100%,480px)}.mark{position:relative;display:grid;place-items:center;width:88px;height:88px;margin:0 auto 28px;border:1px solid var(--edge);border-radius:26px;background:#ffffff06;color:var(--accent);font-size:52px;font-weight:300;box-shadow:0 12px 65px #b698ed14}.mark:before{content:"";position:absolute;inset:-9px;border:1px solid var(--edge);border-top-color:var(--accent);border-radius:32px;animation:orbit 3s linear infinite}
h1{font-size:30px;font-weight:500;letter-spacing:-.8px;margin:0 0 24px}.status{font-size:17px;line-height:1.5;min-height:52px;margin:0}.hint{font-size:14px;color:var(--muted);line-height:1.7;margin:20px auto 0;max-width:390px}.activity{height:3px;margin:22px auto 0;width:160px;overflow:hidden;border-radius:3px;background:var(--edge)}.activity:after{content:"";display:block;width:55%;height:100%;background:var(--accent);border-radius:3px;animation:activity 1.8s ease-in-out infinite}.elapsed{font-size:12px;color:var(--muted);margin-top:20px;font-variant-numeric:tabular-nums}
[data-state=error] .mark:before,[data-state=error] .activity:after{animation:none}[data-state=error] .activity{display:none}[data-state=error] .mark{color:#f0a6a6}[data-state=error] .status{color:#f0a6a6}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes activity{0%{transform:translateX(-110%)}100%{transform:translateX(200%)}}
@media(prefers-color-scheme:light){:root{color:#292032;background:#faf8fd;color-scheme:light;--muted:#6c6279;--accent:#7850b4;--edge:#e2d9ed}body{background:radial-gradient(ellipse at 50% 36%,#eae0f5 0,transparent 60%)}[data-state=error] .status,[data-state=error] .mark{color:#a43232}}
@media(prefers-reduced-motion:reduce){.mark:before,.activity:after{animation:none}.activity:after{width:100%;opacity:.5}}
</style>
</head>
<body data-state="loading">
<main aria-labelledby="title" aria-busy="true">
<div class="mark" aria-hidden="true">B</div>
<h1 id="title">Biank</h1>
<p id="status" class="status" role="status" aria-live="polite">Preparando Biank…</p>
<div class="activity" aria-hidden="true"></div>
<p id="hint" class="hint">Estamos preparando tu espacio. Espera a que Biank termine de iniciar.</p>
<p id="elapsed" class="elapsed"></p>
</main>
<script src="startup.js"></script>
</body></html>
